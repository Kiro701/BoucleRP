<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HMC | Rejoindre & Réseaux Voxtek</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="Image/logo-bouclerp.webp">

  <style>
    main {
      padding: 60px 20px;
      text-align: center;
      max-width: 900px;
      margin: auto;
    }

    .intro {
      margin-bottom: 40px;
    }

    .intro h2 {
      font-size: 2.2rem;
      margin-bottom: 10px;
    }

    .intro p {
      font-size: 1.1rem;
      opacity: 0.9;
    }

    .socials {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin-top: 40px;
    }

    .social-card {
      background: #111;
      border: 1px solid #222;
      border-radius: 12px;
      padding: 25px;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .social-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 30px rgba(255, 59, 59, 0.15);
    }

    .social-card h3 {
      margin-bottom: 10px;
      color: #2e17ff;
    }

    .social-card p {
      font-size: 0.95rem;
      margin-bottom: 15px;
    }

    .btn {
      display: inline-block;
      padding: 10px 20px;
      border-radius: 30px;
      background: #2e17ff;
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      transition: background 0.2s ease;
    }

    .btn:hover {
      background: #2e17ff;
    }
  </style>
</head>

<body>
<!-- Header -->
<div id="header"></div>

<main>
  <section class="intro">
    <h2 data-i18n="join_us_title">Rejoindre la communauté</h2>
    <p data-i18n="join_us_desc">
      La <strong>H.M.C</strong> soutient et partage les réseaux officiels de <strong>Voxtek</strong>.
      Rejoignez-nous pour suivre l’actualité, échanger avec la communauté
      et participer à l’évolution du projet.
    </p>
  </section>

  <section class="socials">
    <div class="social-card">
      <h3 data-i18n="join_us_discord_title">Discord</h3>
      <p data-i18n="join_us_discord_desc">Le cœur de la communauté Voxtek & HMC. Annonces, RP, entraide.</p>
      <a href="https://discord.gg/voxtek" target="_blank" rel="noopener noreferrer" class="btn" data-i18n="join_us_discord_btn">
        Rejoindre le Discord
      </a>
    </div>
  </section>
</main>

<!-- Footer -->
<div id="footer"></div>
<!-- JS for Header/Footer-->
<script src="js/layout.js"></script>

<!-- Traduction -->
<script src="data/translations.js"></script>
<script src="js/main-i18n.js"></script>

</body>
</html>
