<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HMC • Journal des soirées</title>

<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="Image/logo-bouclerp.webp">


<link rel="stylesheet" href="css/soirees.css">
<style>
/* ================= CALENDRIER ================= */
.calendar-header {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 20px;
  margin: 30px 0;
}

.calendar-header button {
  background: var(--primary);
  border: none;
  padding: 8px 14px;
  border-radius: 8px;
  cursor: pointer;
}

#calendar {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 10px;
}

.day {
  background: rgba(15,18,30,0.9);
  border: 1px solid var(--border-soft);
  border-radius: 12px;
  padding: 10px;
  min-height: 80px;
  cursor: pointer;
}

.day.has-session {
  border-color: var(--primary);
}

.day.special {
  box-shadow: 0 0 15px rgba(255,215,0,0.4);
}

.day-number {
  font-weight: bold;
}

.count {
  font-size: 0.75rem;
  opacity: 0.7;
}

/* ================= TAGS ================= */
.filters {
  display: flex;
  gap: 10px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 25px;
}

.filter-btn {
  padding: 6px 14px;
  border-radius: 20px;
  border: 1px solid var(--primary);
  background: transparent;
  color: var(--primary);
  cursor: pointer;
}

.filter-btn.active {
  background: var(--primary);
  color: #000;
}

/* ================= MODAL ================= */
#dayModal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.85);
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 9999;
}

.modal-content {
  background: #0b0e1a;
  max-width: 900px;
  width: 90%;
  max-height: 90vh;
  overflow-y: auto;
  border-radius: 18px;
  padding: 25px;
}

/* ================= SESSIONS ================= */
.session {
  border: 1px solid var(--border-soft);
  border-radius: 16px;
  padding: 20px;
  margin-bottom: 25px;
}

.session.major {
  border-color: gold;
}

.images {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(120px,1fr));
  gap: 10px;
  margin-top: 15px;
}

.images img {
  width: 100%;
  height: 100px;
  object-fit: cover;
  border-radius: 10px;
  cursor: pointer;
}

.author {
  font-size: 0.65rem;
  opacity: 0.6;
  text-align: center;
}

/* ================= LIGHTBOX ================= */
#lightbox {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.95);
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 10000;
}

#lightbox img {
  max-width: 90%;
  max-height: 90%;
  cursor: zoom-in;
}

#lightbox img.zoom {
  transform: scale(1.8);
  cursor: zoom-out;
}

.lightbox-nav {
  position: absolute;
  font-size: 50px;
  cursor: pointer;
  user-select: none;
}

.prev { left: 30px; }
.next { right: 30px; }

.close {
  position: absolute;
  top: 20px;
  right: 25px;
  font-size: 30px;
  cursor: pointer;
}

/* ================= RESPONSIVE ================= */
@media (max-width: 600px) {
  #calendar {
    grid-template-columns: repeat(4,1fr);
  }
}
</style>
</head>

<body>

<div id="header"></div>

<main>
  <h2 class="page-title">Journal des séances</h2>
  <div class="calendar-header">
    <button id="prev">◀</button>
    <h2 id="title"></h2>
    <button id="next">▶</button>
  </div>

  <div class="filters">
    <button class="filter-btn active" data-tag="all">Tout</button>
    <button class="filter-btn" data-tag="VRChat">VRChat</button>
    <button class="filter-btn" data-tag="Event">Event</button>
    <button class="filter-btn" data-tag="Fun">Fun</button>
    <button class="filter-btn" data-tag="RP">RP</button>
    <button class="filter-btn" data-tag="Visite">Visite</button>
  </div>

  <div id="calendar"></div>

</main>

<!-- MODAL JOUR -->
<div id="dayModal">
  <div class="modal-content" id="dayContent"></div>
</div>

<!-- LIGHTBOX -->
<div id="lightbox">
  <span class="close">✕</span>
  <span class="lightbox-nav prev">❮</span>
  <img id="lightboxImg">
  <span class="lightbox-nav next">❯</span>
</div>

<div id="footer"></div>

<script src="js/layout.js"></script>
<script src="data/soirees-data.js"></script>
<script src="js/soirees.js"></script>

</body>
</html>
