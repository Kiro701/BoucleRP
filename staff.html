<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HMC | Staff</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="Image/logo-bouclerp.webp">
    <style>
    :root {
      --accent-main: #7a7cff;      /* violet bleuté principal */
      --accent-soft: #9fa8ff;      /* violet clair */
      --accent-glow: rgba(122,124,255,0.6);
      --accent-border: rgba(122,124,255,0.35);
      --text-main: #ffffff;
      --text-soft: #cfd3ff;
    }

    /* ===== Container Principal ===== */
    .staff-container {
      max-width: 1200px;
      margin: auto;
      padding: 40px 20px;
    }

    .staff-container h2 {
      text-align: center;
      font-size: 2rem;
      color: var(--accent-main);
      margin-bottom: 40px;
      text-shadow: 0 0 15px var(--accent-glow);
    }

    .staff-category {
      margin-bottom: 60px;
    }

    .staff-category h3 {
      font-size: 1.5rem;
      color: var(--accent-soft);
      margin-bottom: 25px;
      border-bottom: 2px solid var(--accent-main);
      display: inline-block;
      padding-bottom: 6px;
    }

    /* ===== Grid & Cartes ===== */
    .staff-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 25px;
    }

    .staff-card {
      background: rgba(15,15,22,0.92);
      border: 1px solid var(--accent-border);
      border-radius: 18px;
      width: 200px;
      height: 200px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 18px;
      position: relative;
      transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
      overflow: hidden; /* Pour que les effets ne débordent pas salement */
    }

    /* ===== Définition des couleurs de lueur par rang ===== */
    .staff-card[data-rank="fondateur"]      { --rank-glow: #ffde90; }
    .staff-card[data-rank="co-fondateur"]   { --rank-glow: #9e6bff; }
    .staff-card[data-rank="pilier"]         { --rank-glow: #ef0004; }
    .staff-card[data-rank="resp-admin"],
    .staff-card[data-rank="admin"]          { --rank-glow: rgb(168, 67, 0); }
    .staff-card[data-rank="resp-whitelist"] { --rank-glow: rgb(255, 255, 255); }
    .staff-card[data-rank="resp-rp"]        { --rank-glow: rgb(153, 170, 181); }
    .staff-card[data-rank="resp-modo"],
    .staff-card[data-rank="modérateur"]     { --rank-glow: rgb(113, 54, 138); }
    .staff-card[data-rank="resp-helper"]    { --rank-glow: rgb(96, 125, 139); }
    .staff-card[data-rank="community"]      { --rank-glow: rgb(196, 201, 206); }
    .staff-card[data-rank="helper"]         { --rank-glow: rgb(153, 170, 181); }
    .staff-card[data-rank="animateur"]      { --rank-glow: rgb(255, 221, 0); }

    /* Application de la lueur de base selon le rang */
    .staff-card {
      box-shadow: 0 0 12px var(--rank-glow, var(--accent-glow));
    }

    /* ===== Effet Hover (Lueur intense) ===== */
    .staff-card:hover {
      transform: translateY(-6px) scale(1.05);
      box-shadow: 0 0 25px var(--rank-glow, var(--accent-glow));
      border-color: var(--rank-glow, var(--accent-main));
    }

    /* ===== Éléments internes ===== */
    .staff-card img {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      border: 2px solid var(--accent-main);
      margin-bottom: 10px;
      object-fit: cover;
      box-shadow: 0 0 10px rgba(0,0,0,0.5);
      z-index: 2;
      transition: border-color 0.3s ease;
    }

    .staff-card:hover img {
      border-color: var(--rank-glow, var(--accent-main));
    }

    .staff-card h4 {
      font-size: 1rem;
      color: var(--text-main);
      margin-bottom: 5px;
      z-index: 2;
    }

    .staff-card p {
      font-size: 0.85rem;
      color: var(--text-soft);
      z-index: 2;
    }

    /* ===== Bordures Spéciales Fondateurs (Gradients) ===== */
    .staff-card[data-rank="fondateur"]::before, 
    .staff-card[data-rank="co-fondateur"]::before { 
      content: ""; 
      position: absolute; 
      inset: 0; 
      border-radius: 16px; 
      padding: 2px; 
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0); 
      -webkit-mask-composite: destination-out;
      mask-composite: exclude; 
      z-index: 1; 
    }

    .staff-card[data-rank="fondateur"]::before { 
      background: linear-gradient(135deg, #d4843d, #ffde90, #d4843d);
    }

    .staff-card[data-rank="co-fondateur"]::before { 
      background: linear-gradient(135deg, #9e6bff, #9fc1ff, #9fc1ff); 
    }

    /* ===== Responsive ===== */
    @media screen and (max-width: 768px) {
      .staff-card {
        width: 150px;
        height: 150px;
      }
      .staff-card img {
        width: 60px;
        height: 60px;
      }
      .staff-card h4 { font-size: 0.9rem; }
      .staff-card p { font-size: 0.75rem; }
    }
  </style>
