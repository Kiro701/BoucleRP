<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HMC | Staff</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="Image/logo-bouclerp.webp">

  <style>
    :root {
      --accent-main: #7a7cff;
      --accent-soft: #9fa8ff;
      --accent-glow: rgba(122,124,255,0.6);
      --accent-border: rgba(122,124,255,0.35);
      --text-main: #ffffff;
      --text-soft: #cfd3ff;
    }

    .staff-container {
      max-width: 1200px;
      margin: auto;
      padding: 40px 20px;
    }

    .staff-container h2 {
      text-align: center;
      font-size: 2rem;
      color: var(--accent-main);
      margin-bottom: 40px;
      text-shadow: 0 0 15px var(--accent-glow);
    }

    .staff-category {
      margin-bottom: 60px;
    }

    .staff-category h3 {
      font-size: 1.5rem;
      color: var(--accent-soft);
      margin-bottom: 25px;
      border-bottom: 2px solid var(--accent-main);
      display: inline-block;
      padding-bottom: 6px;
    }

    .staff-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 25px;
    }

    .staff-card {
      background: rgba(15,15,22,0.92);
      border: 1px solid var(--accent-border);
      border-radius: 18px;
      width: 200px;
      min-height: 220px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 18px;
      position: relative;
      transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
      overflow: visible;
      box-shadow: 0 0 12px var(--rank-glow, var(--accent-glow));
    }

    .staff-card[data-rank="fondateur"] { --rank-glow: #0033ff; }
    .staff-card[data-rank="co-fondateur"] { --rank-glow: #9e6bff; }
    .staff-card[data-rank="regent"] { --rank-glow: #f1c40f; }
    .staff-card[data-rank="manager"] { --rank-glow: #9e6bff;; }
    .staff-card[data-rank="adjoint-moderator"] { --rank-glow: #8e44ad; }
    .staff-card[data-rank="pilier"] { --rank-glow: #ee0000; }
    .staff-card[data-rank="resp-admin"] { --rank-glow: #1691e1; }
    .staff-card[data-rank="admin"] { --rank-glow: #a84300; }
    .staff-card[data-rank="resp-whitelist"] { --rank-glow: #1691e1; }
    .staff-card[data-rank="resp-rp"] { --rank-glow: #99aab5; }
    .staff-card[data-rank="resp-modo"],
    .staff-card[data-rank="modérateur"] { --rank-glow: #71368a; }
    .staff-card[data-rank="resp-helper"] { --rank-glow: #607d8b; }
    .staff-card[data-rank="community"] { --rank-glow: #c4c9ce; }
    .staff-card[data-rank="helper"] { --rank-glow: #99aab5; }
    .staff-card[data-rank="animateur"] { --rank-glow: #ffdd00; }

    .staff-card:hover {
      transform: translateY(-6px) scale(1.05);
      box-shadow: 0 0 25px var(--rank-glow, var(--accent-glow));
      border-color: var(--rank-glow, var(--accent-main));
    }

    .staff-card img.avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      border: 2px solid var(--accent-border);
      margin-bottom: 10px;
      object-fit: cover;
      z-index: 2;
      transition: opacity 0.4s ease, transform 0.3s ease, border-color 0.3s ease;
      background-color: #1a1a24;
      animation: pulse-load 1.5s infinite ease-in-out;
      opacity: 0.3;
    }

    .staff-card:hover img.avatar {
      border-color: var(--rank-glow, var(--accent-main));
    }

    .staff-card h4 {
      font-size: 1rem;
      color: var(--text-main);
      margin: 0 0 5px;
      z-index: 2;
    }

    .staff-card p {
      font-size: 0.85rem;
      color: var(--text-soft);
      margin: 0;
      z-index: 2;
    }

    .staff-platforms {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-top: 10px;
      z-index: 5;
    }

    .platform-badge {
      width: 28px;
      height: 28px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(255,255,255,0.16);
      background: rgba(255,255,255,0.07);
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
      cursor: help;
      position: relative;
      transition: transform 0.2s ease, opacity 0.2s ease, background 0.2s ease, border-color 0.2s ease;
    }

    .platform-badge:hover {
      transform: translateY(-2px) scale(1.12);
      background: rgba(255,255,255,0.13);
      border-color: var(--rank-glow, var(--accent-main));
    }

    .platform-badge svg {
      width: 17px;
      height: 17px;
      fill: white;
      display: block;
    }

    .platform-badge::after {
      content: attr(data-tooltip);
      position: absolute;
      left: 50%;
      bottom: calc(100% + 8px);
      transform: translateX(-50%) translateY(4px);
      background: rgba(10,10,16,0.96);
      color: white;
      font-size: 0.72rem;
      line-height: 1;
      padding: 7px 9px;
      border-radius: 8px;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      border: 1px solid rgba(255,255,255,0.12);
      box-shadow: 0 0 15px rgba(0,0,0,0.35);
      transition: opacity 0.2s ease, transform 0.2s ease;
      z-index: 20;
    }

    .platform-badge:hover::after {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .platform-discord {
      background: rgba(88,101,242,0.22);
    }

    .platform-vrchat {
      background: rgba(0,180,255,0.18);
    }

    .staff-card::before {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: 16px;
        padding: 2px;
        -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
        -webkit-mask-composite: destination-out;
        mask-composite: exclude;
        z-index: 1;
        pointer-events: none;
    }

    .staff-card[data-rank="fondateur"]::before {
        background: linear-gradient(135deg, #0033ff, #6988c7, #0033ff); 
    }

    .staff-card[data-rank="co-fondateur"]::before {
        background: linear-gradient(135deg, #9e6bff, #9fc1ff, #9e6bff);
    }

    .staff-card[data-rank="resp-admin"]::before {
        background: linear-gradient(135deg, #1691e1, #e5da0d, #1691e1);
    }

    .staff-card[data-rank="pilier"]::before {
        background: linear-gradient(135deg, #ee0000, #3b0101, #ee0000);
    }

    .staff-card[data-rank="resp-whitelist"]::before {
        background: linear-gradient(135deg, #37036d, #761212, #37036d);
    }
    .staff-card[data-rank="manager"]::before {
        background: linear-gradient(135deg, #9e6bff, #231a1a, #9e6bff);
    }

    @keyframes pulse-load {
      0% { background-color: rgba(255, 255, 255, 0.05); box-shadow: 0 0 10px rgba(122,124,255,0.1); }
      50% { background-color: rgba(255, 255, 255, 0.15); box-shadow: 0 0 20px rgba(122,124,255,0.3); }
      100% { background-color: rgba(255, 255, 255, 0.05); box-shadow: 0 0 10px rgba(122,124,255,0.1); }
    }

    .staff-card img.avatar.loaded {
      opacity: 1;
      animation: none;
      background-color: transparent;
      border-color: var(--accent-main);
    }

    @media screen and (max-width: 768px) {
      .staff-card {
        width: 150px;
        min-height: 190px;
      }

      .staff-card img.avatar {
        width: 60px;
        height: 60px;
      }
    }
  </style>
</head>

  { cat: "moderators", rank: "modérateur", id: "866376701634543627", name: "la mamie du 95", role: "staff_role_moderator_male" }

const categories = {
  fondators: "Fondateurs",
  pillars: "Piliers",
  responsibles: "Responsables",
  admins: "Administrations",
  moderators: "Modérations Discord",
  community_managers: "Community Managers",
  helpers: "Helpers",
  animators: "Animateurs",
};

function getMemberKey(member) {
  return member.isStatic ? `static-${member.id}` : `discord-${member.id}`;
}

function mergeStaff(discordStaff, vrchatStaff) {
  const map = new Map();

  discordStaff.forEach(member => {
    const key = getMemberKey(member);
    map.set(key, {
      ...member,
      platforms: ["discord"],
      platformRoles: {
        discord: member.role
      }
    });
  });

  vrchatStaff.forEach(member => {
    const key = getMemberKey(member);

    if (map.has(key)) {
      const existing = map.get(key);

      if (!existing.platforms.includes("vrchat")) {
        existing.platforms.push("vrchat");
      }

      existing.platformRoles.vrchat = member.role;
    } else {
      map.set(key, {
        ...member,
        platforms: ["vrchat"],
        platformRoles: {
          vrchat: member.role
        }
      });
    }
  });

  return Array.from(map.values());
}

function platformIcon(platform) {
  if (platform === "discord") {
    return `
      <span class="platform-badge platform-discord" data-tooltip="Discord" aria-label="Discord">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M20.3 4.4A16.2 16.2 0 0 0 16.3 3l-.2.4c1.4.4 2.1 1 2.1 1s-1.8-1-5.4-1-5.4 1-5.4 1 .8-.6 2.1-1L9.3 3a16.2 16.2 0 0 0-4 1.4C2.8 8.1 2.1 11.7 2.4 15.2A16 16 0 0 0 7.3 17.7l.9-1.2c-.5-.2-1-.4-1.4-.7l.3-.2c2.8 1.3 5.9 1.3 8.7 0l.3.2c-.5.3-.9.5-1.4.7l.9 1.2a16 16 0 0 0 4.9-2.5c.4-4.1-.7-7.6-2.2-10.8ZM9.1 13.3c-.9 0-1.6-.8-1.6-1.8s.7-1.8 1.6-1.8 1.6.8 1.6 1.8-.7 1.8-1.6 1.8Zm5.8 0c-.9 0-1.6-.8-1.6-1.8s.7-1.8 1.6-1.8 1.6.8 1.6 1.8-.7 1.8-1.6 1.8Z"/>
        </svg>
      </span>`;
  }

  if (platform === "vrchat") {
    return `
      <span class="platform-badge platform-vrchat" data-tooltip="VRChat" aria-label="VRChat">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M5 5.5h14a3 3 0 0 1 3 3v5.2a3 3 0 0 1-3 3h-5.2L9.5 20v-3.3H5a3 3 0 0 1-3-3V8.5a3 3 0 0 1 3-3Zm1.4 3.2 2.1 5.2h1.7l2.1-5.2h-1.7l-1.2 3.4-1.2-3.4H6.4Zm6.6 0v5.2h1.5v-1.7h.8l1.1 1.7h1.8l-1.3-1.9c.7-.3 1.1-.9 1.1-1.6 0-1.1-.8-1.7-2.1-1.7H13Zm1.5 1.3h1.2c.5 0 .8.2.8.6s-.3.6-.8.6h-1.2V10Z"/>
        </svg>
      </span>`;
  }

  return "";
}

function renderStaff() {
  const container = document.getElementById("staff-list");
  const staffData = mergeStaff(discordStaffData, vrchatStaffData);
  const usedKeys = new Set();

  container.innerHTML = "";

  Object.entries(categories).forEach(([key, title]) => {
    let members = staffData.filter(member => member.cat === key);

    if (key === "moderators_vrc") {
      members = members.filter(member => !usedKeys.has(getMemberKey(member)));
    }

    if (members.length === 0) return;

    let sectionHtml = `
      <div class="staff-category">
        <h3 data-i18n="staff_subtitles_${key}">${title}</h3>
        <div class="staff-grid">`;

    members.forEach(member => {
      usedKeys.add(getMemberKey(member));

      const safeId = getMemberKey(member).replace(/[^a-zA-Z0-9]/g, "");
      const initialSrc = member.isStatic ? member.id : "https://kiro701.github.io/BoucleRP/Image/Profil-Neutre.avif";
      const iconsHtml = member.platforms.map(platformIcon).join("");

      sectionHtml += `
        <div class="staff-card" data-rank="${member.rank}">
          <img id="img-${safeId}" class="avatar ${member.isStatic ? "loaded" : ""}" src="${initialSrc}" alt="${member.name}">
          <h4>${member.name}</h4>
          <p data-i18n="${member.role}">${member.role}</p>
          <div class="staff-platforms">
            ${iconsHtml}
          </div>
        </div>`;
    });

    sectionHtml += `
        </div>
      </div>`;

    container.innerHTML += sectionHtml;
  });

  loadAvatars(staffData);
}

async function loadAvatars(staffData) {
  const WORKER_URL = "https://divine-moon-e24f.ptitleo2009.workers.dev/";
  const GUILD_ID = "1025887285461405817";

  const discordIds = [...new Set(
    staffData
      .filter(member => !member.isStatic)
      .map(member => member.id)
  )];

  try {
    const res = await fetch(`${WORKER_URL}?guild=${GUILD_ID}&ids=${discordIds.join(",")}`);
    if (!res.ok) throw new Error(`Erreur Worker: ${res.status}`);

    const avatarMap = await res.json();

    discordIds.forEach(id => {
      const key = `discord-${id}`;
      const safeId = key.replace(/[^a-zA-Z0-9]/g, "");
      const imgElement = document.getElementById(`img-${safeId}`);

      if (!imgElement) return;

      const url = avatarMap[id];

      if (!url) {
        imgElement.classList.add("loaded");
        return;
      }

      const temp = new Image();
      temp.src = url;
      temp.onload = () => {
        imgElement.src = url;
        imgElement.classList.add("loaded");
      };
      temp.onerror = () => {
        imgElement.classList.add("loaded");
      };
    });
  } catch (err) {
    console.error("Erreur de chargement des PP:", err);
    document.querySelectorAll(".staff-card img.avatar").forEach(img => img.classList.add("loaded"));
  }
}

renderStaff();
