<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HMC | Arbre de famille de cœur</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="Image/logo-bouclerp.webp">

  <style>
    :root {
      --hmc-bg: #10142e;
      --hmc-bg-2: #080d1c;
      --hmc-panel: #0b1022;
      --hmc-panel-soft: #111734;
      --hmc-border: rgba(255, 0, 184, .22);
      --hmc-text: #f5f5f7;
      --hmc-muted: #b9bfd1;
      --hmc-line: rgba(255,255,255,.38);
      --hmc-blue: #188cff;
      --hmc-orange: #ff8a35;
      --hmc-yellow: #f5bd28;
      --hmc-gray: #98a2b3;
      --hmc-love: #ff00b8;
      --hmc-divorce: #8b91a8;
      --hmc-focus: #ff00b8;
      --hmc-shadow: 0 18px 45px rgba(0, 0, 0, .38);
    }

    .family-page { min-height: calc(100vh - 120px); background: linear-gradient(180deg, #10142e 0%, #10142e 70%, #0a0f20 100%); color: var(--hmc-text); }
    .family-app { display: grid; grid-template-columns: auto 1fr; height: calc(100vh - 120px); min-height: 760px; overflow: hidden; border-top: 1px solid var(--hmc-border); position: relative; }
    .family-app:fullscreen { height: 100vh; min-height: 100vh; background: #10142e; }

    .family-panel { width: 300px; background: rgba(8,13,28,.96); border-right: 1px solid var(--hmc-border); padding: 20px; overflow-y: auto; box-shadow: 8px 0 30px rgba(0,0,0,.28); z-index: 5; text-align: left; transition: width .25s ease, padding .25s ease; }
    .family-panel.collapsed { width: 0; padding-left: 0; padding-right: 0; overflow: hidden; border-right: 0; }
    .panel-toggle { position: absolute; top: 18px; left: 0; z-index: 7; width: 42px; height: 42px; border: 1px solid var(--hmc-border); border-radius: 0 12px 12px 0; background: #080d1c; color: var(--hmc-love); font-size: 20px; cursor: pointer; box-shadow: var(--hmc-shadow); transition: left .25s ease; }
    .family-panel:not(.collapsed) + .panel-toggle { left: 300px; }

    .family-panel h2 { margin: 0 0 6px; font-size: 22px; color: var(--hmc-text); }
    .family-panel .subtitle { margin: 0 0 20px; color: var(--hmc-muted); font-size: 14px; line-height: 1.4; }
    .panel-section-title { margin: 22px 0 12px; font-size: 13px; font-weight: 800; color: var(--hmc-love); text-transform: uppercase; letter-spacing: .05em; }
    .family-search { width: 100%; padding: 12px 14px; border: 1px solid rgba(255,255,255,.12); border-radius: 10px; font-size: 14px; outline: none; background: #0f1730; color: var(--hmc-text); }
    .family-search:focus { border-color: var(--hmc-focus); box-shadow: 0 0 0 3px rgba(255,0,184,.12); }

    .check-row { display: flex; align-items: center; gap: 10px; margin: 12px 0; font-size: 14px; color: var(--hmc-muted); }
    .check-row input { width: 16px; height: 16px; accent-color: var(--hmc-focus); }
    .generation-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
    .family-btn { border: 1px solid rgba(255,255,255,.12); background: #111734; color: var(--hmc-text); border-radius: 8px; padding: 10px; cursor: pointer; font-weight: 800; }
    .family-btn.active { background: rgba(255,0,184,.15); color: var(--hmc-love); border-color: rgba(255,0,184,.45); }
    .family-btn.full { width: 100%; margin-top: 10px; }

    .legend-card { margin-top: 22px; border: 1px solid rgba(255,255,255,.1); border-radius: 12px; padding: 14px; background: #0f1730; }
    .legend-row { display: flex; align-items: center; gap: 9px; font-size: 12px; color: var(--hmc-muted); margin: 10px 0; }
    .line-sample { width: 26px; height: 0; border-top: 2px solid var(--hmc-line); }
    .line-sample.love { border-color: var(--hmc-love); }
    .line-sample.divorce { border-color: var(--hmc-divorce); border-top-style: dashed; }
    .ring-sample { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--hmc-blue); }
    .family-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
    .family-stat { background: #0f1730; border: 1px solid rgba(255,255,255,.1); border-radius: 12px; padding: 12px; text-align: center; }
    .family-stat strong { display: block; font-size: 20px; color: var(--hmc-text); }
    .family-stat span { color: var(--hmc-muted); font-size: 12px; }

    .family-workspace { position: relative; overflow: hidden; }
    .canvas-tools { position: absolute; top: 16px; right: 16px; z-index: 4; display: flex; background: #080d1c; border-radius: 10px; box-shadow: var(--hmc-shadow); overflow: hidden; border: 1px solid var(--hmc-border); }
    .canvas-tools button { width: 48px; height: 44px; border: 0; border-right: 1px solid rgba(255,255,255,.1); background: #080d1c; font-size: 18px; cursor: pointer; color: var(--hmc-text); }
    .canvas-tools button:last-child { border-right: 0; }

    .tree-stage { width: 100%; height: 100%; overflow: hidden; cursor: grab; background: radial-gradient(circle at top, #151a38 0%, #10142e 45%, #080d1c 100%); user-select: none; touch-action: none; }
    .tree-stage.dragging { cursor: grabbing; }
    .tree { position: relative; width: 2000px; height: 1200px; transform-origin: 0 0; }
    .generation-label { position: absolute; left: 28px; color: #ff00b8; opacity: .75; font-size: 13px; font-weight: 800; letter-spacing: .02em; }

    svg.relations { position: absolute; inset: 0; width: 2000px; height: 1200px; pointer-events: none; overflow: visible; }
    .family-line { fill: none; stroke: var(--hmc-line); stroke-width: 1.35; }
    .love-line { stroke: var(--hmc-love); stroke-width: 2.5; stroke-linecap: round; }
    .love-heart { fill: var(--hmc-love); font-size: 18px; font-weight: 900; }
    .divorce-line { fill: none; stroke: var(--hmc-divorce); stroke-width: 2.2; stroke-dasharray: 8 7; stroke-linecap: round; opacity: .9; }
    .divorce-cross { fill: #080d1c; stroke: var(--hmc-divorce); stroke-width: 1.5; }
    .divorce-cross-text { fill: var(--hmc-divorce); font-size: 14px; font-weight: 900; text-anchor: middle; dominant-baseline: central; }

    .person { position: absolute; width: 120px; text-align: center; transform: translate(-60px, -48px); cursor: pointer; transition: transform .2s ease, filter .2s ease; z-index: 2; }
    .person:hover { transform: translate(-60px, -53px); }
    .avatar-ring { width: 94px; height: 94px; margin: 0 auto; border-radius: 50%; padding: 4px; background: var(--hmc-blue); box-shadow: 0 6px 16px rgba(0, 0, 0, .35); }
    .avatar-ring.femme { background: var(--hmc-orange); }
    .avatar-ring.nonbinaire { background: var(--hmc-yellow); }
    .avatar-ring.autre { background: var(--hmc-gray); }
    .avatar-ring img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 4px solid white; background: #1a1a24; opacity: .45; animation: pulse-load 1.5s infinite ease-in-out; transition: opacity .3s ease; }
    .avatar-ring img.loaded { opacity: 1; animation: none; }
    @keyframes pulse-load { 0%,100%{box-shadow:0 0 8px rgba(255,0,184,.08)} 50%{box-shadow:0 0 20px rgba(255,0,184,.25)} }
    .name { margin-top: 5px; font-size: 13px; font-weight: 800; color: var(--hmc-text); white-space: nowrap; text-shadow: 0 2px 8px rgba(0,0,0,.45); }
    .dates { font-size: 11px; color: var(--hmc-muted); margin-top: 2px; }
    .person.selected .avatar-ring { box-shadow: 0 0 0 6px rgba(255,0,184,.22), 0 8px 20px rgba(0,0,0,.38); }
    .person.search-match .avatar-ring { box-shadow: 0 0 0 5px rgba(24,140,255,.22), 0 8px 18px rgba(0,0,0,.32); }
    .relation.selected-link { filter: drop-shadow(0 4px 6px rgba(0,0,0,.22)); }

    .modal { display: none; position: absolute; inset: 0; z-index: 10; background: rgba(0,0,0,.55); align-items: center; justify-content: center; }
    .modal-card { width: min(620px, calc(100vw - 32px)); max-height: min(760px, calc(100vh - 48px)); overflow-y: auto; background: #080d1c; border: 1px solid var(--hmc-border); border-radius: 20px; padding: 22px; box-shadow: var(--hmc-shadow); text-align: left; color: var(--hmc-text); }
    .modal-head { display: flex; gap: 14px; align-items: center; }
    .modal-head img { width: 72px; height: 72px; border-radius: 50%; object-fit: cover; }
    .popup-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 18px; }
    .popup-box { background: #0f1730; border: 1px solid rgba(255,255,255,.1); border-radius: 14px; padding: 14px; }
    .popup-box h3 { margin: 0 0 10px; color: var(--hmc-love); font-size: 14px; }
    .pill { display: inline-block; margin: 5px 4px 0 0; padding: 5px 9px; border-radius: 999px; background: rgba(255,0,184,.12); border: 1px solid rgba(255,0,184,.22); font-size: 12px; color: var(--hmc-text); }
    .social-link { display: inline-block; margin: 5px 5px 0 0; padding: 7px 10px; border-radius: 999px; background: rgba(255,255,255,.08); color: var(--hmc-text); text-decoration: none; font-size: 12px; border: 1px solid rgba(255,255,255,.12); }

    @media (max-width: 900px) {
      .family-app { grid-template-columns: 1fr; height: calc(100vh - 90px); min-height: 700px; }
      .family-panel { position: absolute; height: 100%; width: min(86vw, 300px); }
      .panel-toggle { display: block; }
      .family-panel:not(.collapsed) + .panel-toggle { left: min(86vw, 300px); }
      .popup-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
<div id="header"></div>

<main class="family-page">
  <section class="family-app" id="familyApp" aria-label="Arbre de famille de cœur">
    <aside class="family-panel collapsed" id="familyPanel">
      <h2>Famille de cœur</h2>
      <p class="subtitle">Arbre global avec relations familiales, amoureuses et séparations.</p>
      <input id="familySearch" class="family-search" placeholder="🔍 Rechercher une personne…" oninput="searchPeople()">

      <div class="panel-section-title">Filtres</div>
      <label class="check-row"><input id="showLove" type="checkbox" checked onchange="renderTree()">Relations amoureuses</label>
      <label class="check-row"><input id="showDivorce" type="checkbox" onchange="renderTree()">Divorces / ex-relations</label>
      <label class="check-row"><input id="showFamily" type="checkbox" checked onchange="renderTree()">Liens familiaux</label>

      <div class="panel-section-title">Génération</div>
      <div class="generation-grid" id="generationFilter">
        <button class="family-btn active" onclick="setGeneration('all', this)">Toutes</button>
        <button class="family-btn" onclick="setGeneration(1, this)">1</button>
        <button class="family-btn" onclick="setGeneration(2, this)">2</button>
        <button class="family-btn" onclick="setGeneration(3, this)">3</button>
        <button class="family-btn" onclick="setGeneration(4, this)">4</button>
        <button class="family-btn" onclick="setGeneration(5, this)">5</button>
      </div>

      <button class="family-btn full" onclick="clearSelection()">Désélectionner</button>
      <button class="family-btn full" onclick="resetView()">⟳ Réinitialiser</button>

      <div class="family-stats">
        <div class="family-stat"><strong id="statPeople">0</strong><span>membres</span></div>
        <div class="family-stat"><strong id="statRelations">0</strong><span>relations</span></div>
      </div>

      <div class="legend-card">
        <div class="panel-section-title" style="margin-top:0">Légende</div>
        <div class="legend-row"><span class="line-sample"></span>Lien familial</div>
        <div class="legend-row"><span class="line-sample love"></span>Relation amoureuse</div>
        <div class="legend-row"><span class="line-sample divorce"></span>Divorce / ex</div>
        <div class="legend-row"><span class="ring-sample" style="border-color:var(--hmc-blue)"></span>Homme</div>
        <div class="legend-row"><span class="ring-sample" style="border-color:var(--hmc-orange)"></span>Femme</div>
        <div class="legend-row"><span class="ring-sample" style="border-color:var(--hmc-yellow)"></span>Non-binaire</div>
        <div class="legend-row"><span class="ring-sample" style="border-color:var(--hmc-gray)"></span>Autre</div>
      </div>
    </aside>
    <button class="panel-toggle" id="panelToggle" onclick="togglePanel()" title="Ouvrir / fermer les filtres">›</button>

    <section class="family-workspace">
      <div class="canvas-tools">
        <button type="button" onclick="zoomBy(1.15)" title="Zoom +">+</button>
        <button type="button" onclick="zoomBy(.85)" title="Zoom -">−</button>
        <button type="button" onclick="centerTree()" title="Centrer">⌖</button>
        <button type="button" onclick="toggleFullscreen()" title="Plein écran">⛶</button>
        <button type="button" onclick="clearSelection()" title="Désélectionner">✕</button>
      </div>

      <div class="tree-stage" id="familyStage">
        <div class="tree" id="familyTree">
          <svg class="relations" id="relationsSvg"></svg>
        </div>
      </div>

      <div class="modal" id="personModal" onclick="closeModal(event)">
        <div class="modal-card" onclick="event.stopPropagation()">
          <div class="modal-head">
            <img id="modalImg" alt="Photo de profil">
            <div>
              <h2 id="modalName" style="margin:0;font-size:22px;color:var(--hmc-text)"></h2>
              <p id="modalMeta" style="margin:4px 0 0;color:var(--hmc-muted)"></p>
            </div>
          </div>
          <div class="popup-grid">
            <div class="popup-box"><h3>Profil</h3><p id="modalInfo" style="color:var(--hmc-muted);line-height:1.45;margin:0"></p></div>
            <div class="popup-box"><h3>Relations</h3><div id="modalTags"></div></div>
            <div class="popup-box"><h3>Réseaux sociaux</h3><div id="modalSocials"></div></div>
            <div class="popup-box"><h3>Navigation</h3><button class="family-btn full" onclick="centerOnSelected()">Centrer sur cette personne</button></div>
          </div>
          <button class="family-btn full" onclick="document.getElementById('personModal').style.display='none'">Fermer</button>
        </div>
      </div>
    </section>
  </section>
</main>

<div id="footer"></div>

<script>
  const FAMILY_DATA_URL = 'family-data.json';
  const WORKER_URL = 'https://divine-moon-e24f.ptitleo2009.workers.dev/';
  const GUILD_ID = '1025887285461405817';
  const NEUTRAL_IMG = 'https://kiro701.github.io/BoucleRP/Image/Profil-Neutre.avif';

  let people = [];
  let families = [];
  let relations = [];
  let byId = {};
  let generationFilter = 'all';
  let selectedId = null;
  let zoom = 1, panX = 0, panY = 0, isDragging = false;
  let dragStart = {x:0,y:0}, panStart = {x:0,y:0};

  const tree = document.getElementById('familyTree');
  const svg = document.getElementById('relationsSvg');
  const stage = document.getElementById('familyStage');

  function applyTransform(){ tree.style.transform = `translate(${panX}px, ${panY}px) scale(${zoom})`; }

  stage.addEventListener('pointerdown', e => {
    if(e.target.closest('.person') || e.target.closest('button') || e.target.closest('.modal-card')) return;
    clearSelection(false);
    isDragging = true;
    stage.classList.add('dragging');
    dragStart={x:e.clientX,y:e.clientY};
    panStart={x:panX,y:panY};
    stage.setPointerCapture(e.pointerId);
  });
  stage.addEventListener('pointermove', e => { if(!isDragging) return; panX = panStart.x + (e.clientX-dragStart.x); panY = panStart.y + (e.clientY-dragStart.y); applyTransform(); });
  stage.addEventListener('pointerup', () => { isDragging = false; stage.classList.remove('dragging'); });
  stage.addEventListener('pointercancel', () => { isDragging = false; stage.classList.remove('dragging'); });
  stage.addEventListener('wheel', e => {
    e.preventDefault();
    const oldZoom = zoom;
    const factor = e.deltaY < 0 ? 1.09 : 0.91;
    zoom = Math.max(.35, Math.min(2.2, zoom * factor));
    const rect = stage.getBoundingClientRect();
    const mouseX = e.clientX - rect.left;
    const mouseY = e.clientY - rect.top;
    panX = mouseX - (mouseX - panX) * (zoom / oldZoom);
    panY = mouseY - (mouseY - panY) * (zoom / oldZoom);
    applyTransform();
  }, { passive:false });

  function computeAutoLayout() {
    const genYGap = 175;
    const xGap = 145;
    const marginX = 180;
    const marginY = 80;
    const grouped = new Map();
    people.forEach(p => {
      if (!grouped.has(p.gen)) grouped.set(p.gen, []);
      grouped.get(p.gen).push(p);
    });

    [...grouped.entries()].sort((a,b)=>a[0]-b[0]).forEach(([gen, members]) => {
      members.sort((a,b) => {
        const ao = Number.isFinite(a.order) ? a.order : 9999;
        const bo = Number.isFinite(b.order) ? b.order : 9999;
        return ao - bo || a.name.localeCompare(b.name);
      });

      const totalWidth = (members.length - 1) * xGap;
      const startX = marginX + Math.max(0, (1600 - totalWidth) / 2);
      members.forEach((p, i) => {
        p.x = Number.isFinite(p.x) ? p.x : startX + i * xGap;
        p.y = Number.isFinite(p.y) ? p.y : marginY + (gen - 1) * genYGap;
      });
    });

    const maxX = Math.max(...people.map(p => p.x), 1600) + 260;
    const maxY = Math.max(...people.map(p => p.y), 900) + 180;
    tree.style.width = maxX + 'px';
    tree.style.height = maxY + 'px';
    svg.setAttribute('width', maxX);
    svg.setAttribute('height', maxY);
    svg.style.width = maxX + 'px';
    svg.style.height = maxY + 'px';
  }

  function parentPoint(ids){ const nodes=ids.map(id=>byId[id]).filter(Boolean); return {x:nodes.reduce((s,p)=>s+p.x,0)/nodes.length, y:Math.max(...nodes.map(p=>p.y))+47}; }
  function childTop(id){ const p=byId[id]; return {x:p.x,y:p.y-48}; }
  function isPersonVisible(id){ const p = byId[id]; return p && (generationFilter === 'all' || p.gen === generationFilter); }
  function familyPath(f){
    const visibleChildren = f.children.filter(isPersonVisible);
    const visibleParents = f.parents.filter(isPersonVisible);
    if(!visibleChildren.length || !visibleParents.length) return '';
    const start=parentPoint(visibleParents), children=visibleChildren.map(childTop), jy=start.y+54;
    const minX=Math.min(...children.map(c=>c.x),start.x), maxX=Math.max(...children.map(c=>c.x),start.x);
    let d=`M${start.x},${start.y} V${jy}`;
    if(children.length>1)d+=` M${minX},${jy} H${maxX}`;
    children.forEach(c=>d+=` M${c.x},${jy} V${c.y}`);
    return d;
  }
  function loveLine(a,b){ const p1=byId[a],p2=byId[b],left=p1.x<p2.x?p1:p2,right=p1.x<p2.x?p2:p1; const x1=left.x+47,x2=right.x-47,y=(left.y+right.y)/2; return {x1,x2,y,midX:(x1+x2)/2,midY:y}; }
  function smartCurve(a,b,offset=0){ const p1=byId[a],p2=byId[b],distance=Math.abs(p1.x-p2.x),lift=Math.min(180,Math.max(95,distance*.28)); const y1=p1.y-58-offset,y2=p2.y-58-offset; return `M${p1.x},${y1} C${p1.x},${y1-lift} ${p2.x},${y2-lift} ${p2.x},${y2}`; }
  function midpoint(a,b){ const p1=byId[a],p2=byId[b]; return {x:(p1.x+p2.x)/2,y:(p1.y+p2.y)/2-85}; }

  function renderTree(){
    tree.querySelectorAll('.person,.generation-label').forEach(n=>n.remove());
    svg.innerHTML='';
    const showFamily=document.getElementById('showFamily').checked;
    const showLove=document.getElementById('showLove').checked;
    const showDivorce=document.getElementById('showDivorce').checked;
    const visiblePeople = people.filter(p => isPersonVisible(p.id));

    [...new Set(visiblePeople.map(p => p.gen))].forEach(gen => {
      const members = visiblePeople.filter(p => p.gen === gen);
      const y = Math.min(...members.map(p => p.y)) - 45;
      const label=document.createElement('div');
      label.className='generation-label';
      label.style.top=`${y}px`;
      label.textContent=`GÉNÉRATION ${gen}`;
      tree.appendChild(label);
    });

    if(showFamily) families.forEach(f=>{ const d = familyPath(f); if(!d) return; const path=document.createElementNS('http://www.w3.org/2000/svg','path'); path.setAttribute('d',d); path.setAttribute('class','family-line relation family-relation'); path.dataset.ids=[...f.parents,...f.children].join(','); svg.appendChild(path); });

    relations.forEach((r,index)=>{
      if(!isPersonVisible(r.a) || !isPersonVisible(r.b)) return;
      if(r.type==='love'&&showLove){ const l=loveLine(r.a,r.b); const line=document.createElementNS('http://www.w3.org/2000/svg','line'); line.setAttribute('x1',l.x1); line.setAttribute('x2',l.x2); line.setAttribute('y1',l.y); line.setAttribute('y2',l.y); line.setAttribute('class','love-line relation'); line.dataset.ids=`${r.a},${r.b}`; svg.appendChild(line); const text=document.createElementNS('http://www.w3.org/2000/svg','text'); text.setAttribute('x',l.midX-8); text.setAttribute('y',l.midY+6); text.setAttribute('class','love-heart relation'); text.dataset.ids=`${r.a},${r.b}`; text.textContent='♥'; svg.appendChild(text); }
      if(r.type==='divorce'&&showDivorce){ const path=document.createElementNS('http://www.w3.org/2000/svg','path'); path.setAttribute('d',smartCurve(r.a,r.b,12+index*2)); path.setAttribute('class','divorce-line relation'); path.dataset.ids=`${r.a},${r.b}`; svg.appendChild(path); const m=midpoint(r.a,r.b); const circle=document.createElementNS('http://www.w3.org/2000/svg','circle'); circle.setAttribute('cx',m.x); circle.setAttribute('cy',m.y); circle.setAttribute('r',11); circle.setAttribute('class','divorce-cross relation'); circle.dataset.ids=`${r.a},${r.b}`; svg.appendChild(circle); const cross=document.createElementNS('http://www.w3.org/2000/svg','text'); cross.setAttribute('x',m.x); cross.setAttribute('y',m.y+1); cross.setAttribute('class','divorce-cross-text relation'); cross.dataset.ids=`${r.a},${r.b}`; cross.textContent='×'; svg.appendChild(cross); }
    });

    visiblePeople.forEach(p=>{
      const el=document.createElement('div');
      el.className=`person gen-${p.gen}`;
      el.dataset.id=p.id;
      el.style.left=`${p.x}px`;
      el.style.top=`${p.y}px`;
      const avatar = p.resolvedImg || p.img || NEUTRAL_IMG;
      el.innerHTML=`<div class="avatar-ring ${p.gender}"><img id="avatar-${p.id}" src="${avatar}" alt="${p.name}"></div><div class="name">${p.name}</div><div class="dates">${p.dates || ''}</div>`;
      el.onclick=(event)=>{ event.stopPropagation(); selectPerson(p.id,true); };
      tree.appendChild(el);
      const img = el.querySelector('img');
      img.onload = () => img.classList.add('loaded');
      if (img.complete) img.classList.add('loaded');
    });

    document.getElementById('statPeople').textContent=people.length;
    document.getElementById('statRelations').textContent=relations.length;
    if(selectedId && isPersonVisible(selectedId)) selectPerson(selectedId,false);
  }

  function relationIdsFromElement(el){ return new Set((el.dataset.ids||'').split(',').filter(Boolean)); }
  function setGeneration(value,btn){ generationFilter=value; selectedId = null; document.getElementById('familySearch').value=''; document.querySelectorAll('#generationFilter .family-btn').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); renderTree(); }
  function selectPerson(id,open=true){ selectedId=id; document.querySelectorAll('.person').forEach(el=>{ el.classList.toggle('selected', el.dataset.id===id); el.classList.remove('search-match'); }); document.querySelectorAll('.relation').forEach(el=>{ const related=relationIdsFromElement(el).has(id); el.classList.toggle('selected-link', related); }); if(open) openModal(byId[id]); }
  function searchPeople(){
    selectedId=null;
    const q=document.getElementById('familySearch').value.trim().toLowerCase();
    document.querySelectorAll('.person').forEach(el=>{
      const p=byId[el.dataset.id];
      const match=!!q && (p.name.toLowerCase().includes(q)||(p.role||'').toLowerCase().includes(q));
      el.classList.toggle('search-match', match);
      el.classList.remove('selected');
    });
    document.querySelectorAll('.relation').forEach(el=>el.classList.remove('selected-link'));
    const first = people.find(p => isPersonVisible(p.id) && (p.name.toLowerCase().includes(q) || (p.role||'').toLowerCase().includes(q)));
    if(q && first) centerOn(first.id);
  }
  function clearSelection(closePopup=true){ selectedId=null; document.querySelectorAll('.person').forEach(el=>el.classList.remove('selected','search-match')); document.querySelectorAll('.relation').forEach(el=>el.classList.remove('selected-link')); if(closePopup) document.getElementById('personModal').style.display='none'; }

  function openModal(p){
    document.getElementById('modalImg').src=p.resolvedImg || p.img || NEUTRAL_IMG;
    document.getElementById('modalName').textContent=p.name;
    document.getElementById('modalMeta').textContent=`${p.role || 'Membre'} · Génération ${p.gen}${p.dates ? ' · ' + p.dates : ''}`;
    document.getElementById('modalInfo').textContent=p.bio || `Profil de test pour ${p.name}.`;
    const tags=relations.filter(r=>r.a===p.id||r.b===p.id).map(r=>{ const other=byId[r.a===p.id?r.b:r.a]; return `<span class="pill">${r.label || r.type} : ${other?.name || 'Inconnu'}</span>`; });
    const familyTags=families.filter(f=>f.parents.includes(p.id)||f.children.includes(p.id)).map(f=>f.parents.includes(p.id)?`<span class="pill">Transmission vers ${f.children.length} membre(s)</span>`:`<span class="pill">Lié à ${f.parents.map(id=>byId[id]?.name).join(' & ')}</span>`);
    document.getElementById('modalTags').innerHTML=[...tags,...familyTags].join('')||'<span class="pill">Aucune relation renseignée</span>';
    const socials = p.socials || {};
    document.getElementById('modalSocials').innerHTML = Object.entries(socials).map(([name,url]) => `<a class="social-link" href="${url}" target="_blank" rel="noopener noreferrer">${name}</a>`).join('') || '<span class="pill">Aucun réseau renseigné</span>';
    document.getElementById('personModal').style.display='flex';
  }

  function closeModal(e){ if(!e||e.target.id==='personModal') document.getElementById('personModal').style.display='none'; }
  function zoomBy(multiplier){ zoom=Math.max(.35,Math.min(2.2,zoom*multiplier)); applyTransform(); }
  function centerTree(){ const w=parseFloat(tree.style.width)||2000; panX=Math.max(20,(stage.clientWidth-w*zoom)/2); panY=20; applyTransform(); }
  function centerOn(id){ const p = byId[id]; if(!p) return; panX = stage.clientWidth/2 - p.x * zoom; panY = stage.clientHeight/2 - p.y * zoom; applyTransform(); }
  function centerOnSelected(){ if(selectedId) centerOn(selectedId); }
  function resetView(){ zoom=1; generationFilter='all'; selectedId=null; document.getElementById('familySearch').value=''; document.querySelectorAll('#generationFilter .family-btn').forEach((b,i)=>b.classList.toggle('active',i===0)); renderTree(); centerTree(); }
  function togglePanel(){ const panel=document.getElementById('familyPanel'), button=document.getElementById('panelToggle'); panel.classList.toggle('collapsed'); button.textContent=panel.classList.contains('collapsed')?'›':'‹'; }
  function toggleFullscreen(){ const app = document.getElementById('familyApp'); if(!document.fullscreenElement) app.requestFullscreen?.(); else document.exitFullscreen?.(); }

  async function resolveDiscordAvatars() {
    const discordIds = people.filter(p => p.discordId).map(p => p.discordId);
    if (!discordIds.length) return;
    try {
      const res = await fetch(`${WORKER_URL}?guild=${GUILD_ID}&ids=${discordIds.join(',')}`);
      const avatarMap = await res.json();
      people.forEach(p => {
        if (p.discordId && avatarMap[p.discordId]) p.resolvedImg = avatarMap[p.discordId];
      });
    } catch(err) {
      console.error('Erreur de chargement des PP Discord:', err);
    }
  }

  async function loadFamilyData(){
    try {
      const response = await fetch(FAMILY_DATA_URL, { cache: 'no-store' });
      if(!response.ok) throw new Error('Fichier introuvable');
      const data = await response.json();
      people = data.people || [];
      families = data.families || [];
      relations = data.relations || [];
      byId = Object.fromEntries(people.map(p => [p.id, p]));
      computeAutoLayout();
      await resolveDiscordAvatars();
      renderTree();
      setTimeout(centerTree, 100);
    } catch(error) {
      console.error('Erreur chargement family-data.json :', error);
      tree.innerHTML = '<p style="color:white;padding:40px">Impossible de charger <strong>family-data.json</strong>. Vérifie que le fichier est bien à la racine du site.</p><svg class="relations" id="relationsSvg"></svg>';
    }
  }

  loadFamilyData();
</script>

<script src="js/layout.js"></script>
<script src="data/translations.js"></script>
<script src="js/main-i18n.js"></script>
</body>
</html>
