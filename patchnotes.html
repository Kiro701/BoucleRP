<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HMC | Patch Notes</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="Image/logo-bouclerp.webp">
    <style>
        :root { --primary-light: #7a7cff; --border-soft: rgba(122, 124, 255, 0.2); }
        .patch-container { max-width: 1000px; margin: auto; padding: 40px 20px; }
        .patch-card { 
            background: rgba(15, 18, 30, 0.9); border-radius: 16px; padding: 25px; 
            margin-bottom: 30px; border: 1px solid var(--border-soft); 
            transition: box-shadow 0.3s ease;
        }
        /* Effet de surbrillance quand on arrive via un lien */
        .patch-card:target { box-shadow: 0 0 30px rgba(122, 124, 255, 0.5); border-color: var(--primary-light); }
        
        .patch-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 15px; }
        .patch-version { font-size: 1.3rem; font-weight: bold; color: var(--primary-light); }
        .patch-date { font-size: 0.85rem; opacity: 0.7; }

        .share-btn {
            background: rgba(122, 124, 255, 0.1); border: 1px solid var(--primary-light);
            color: var(--primary-light); border-radius: 8px; padding: 6px 12px;
            cursor: pointer; display: flex; align-items: center; gap: 8px; font-size: 0.8rem;
        }
        .share-btn:hover { background: var(--primary-light); color: #fff; }

        .patch-section { margin-top: 15px; }
        .add { color: #4ade80; } .improve { color: #60a5fa; } .fix { color: #f87171; }
        .patch-section ul { padding-left: 20px; }
        
        .copy-toast {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            background: #4ade80; color: white; padding: 10px 20px; border-radius: 50px;
            z-index: 1000; animation: fadeInOut 2.5s forwards;
        }
        @keyframes fadeInOut { 0% {opacity:0;} 15% {opacity:1;} 85% {opacity:1;} 100% {opacity:0;} }
    </style>
</head>
<body>
<div id="header"></div>
<main class="patch-container">
    <h2 data-i18n="patch_title">🛠 Patch Notes</h2>
    <div id="patchContainer"></div>
</main>
<div id="footer"></div>

<script src="js/layout.js"></script>
<script src="data/patchnotes-data.js"></script>
<script>
    const container = document.getElementById("patchContainer");

    async function sharePatch(version) {
        const patchId = `v${version.replace(/\./g, '-')}`;
        const urlToShare = `${window.location.origin}${window.location.pathname}#${patchId}`;

        try {
            if (navigator.share) {
                await navigator.share({ title: `HMC Patch ${version}`, url: urlToShare });
            } else {
                await navigator.clipboard.writeText(urlToShare);
                showToast("Lien du patch copié !");
            }
        } catch (err) {}
    }

    function showToast(m) {
        const t = document.createElement("div"); t.className = "copy-toast";
        t.innerText = m; document.body.appendChild(t);
        setTimeout(() => t.remove(), 2500);
    }

    patchNotesData.forEach(patch => {
        const patchId = `v${patch.version.replace(/\./g, '-')}`;
        const card = document.createElement("div");
        card.className = "patch-card";
        card.id = patchId;

        card.innerHTML = `
            <div class="patch-header">
                <div>
                    <div class="patch-version">Version ${patch.version}</div>
                    <div class="patch-date">📅 ${patch.date}</div>
                </div>
                <button class="share-btn" onclick="sharePatch('${patch.version}')">
                    <svg width="14" height="14" fill="currentColor" viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92s2.92-1.31 2.92-2.92c0-1.61-1.31-2.92-2.92-2.92z"/></svg>
                    Partager
                </button>
            </div>
            ${patch.add.length ? `<div class="patch-section"><h4 class="add">➕ Ajouts</h4><ul>${patch.add.map(a=>`<li>${a}</li>`).join("")}</ul></div>` : ""}
            ${patch.fix.length ? `<div class="patch-section"><h4 class="fix">🐛 Corrections</h4><ul>${patch.fix.map(f=>`<li>${f}</li>`).join("")}</ul></div>` : ""}
        `;
        container.appendChild(card);
    });
</script>
</body>
</html>
