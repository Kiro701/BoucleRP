<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HMC | Galerie</title>

  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="Image/logo-bouclerp.webp">

  <style>
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 25px;
    }

    .gallery-card {
      background: rgba(15, 18, 30, 0.9);
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid var(--border-soft);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      cursor: pointer;
    }

    .gallery-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 0 25px var(--primary-glow);
    }

    .gallery-card img {
      width: 100%;
      height: 160px;
      object-fit: cover;
    }

    .gallery-info {
      padding: 14px;
      text-align: left;
    }

    .gallery-info h4 {
      color: var(--primary-light);
      font-size: 1rem;
      margin-bottom: 6px;
    }

    .gallery-info span {
      font-size: 0.75rem;
      opacity: 0.7;
      display: block;
      margin-bottom: 8px;
    }

    .gallery-info p {
      font-size: 0.85rem;
      opacity: 0.85;
      line-height: 1.4;
    }

    /* MODAL */
    .gallery-modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.9);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }

    .gallery-modal-content {
      max-width: 90%;
      max-height: 90%;
      text-align: center;
    }

    .gallery-modal img {
      max-width: 100%;
      max-height: 70vh;
      border-radius: 14px;
    }

    .gallery-modal h3 {
      margin-top: 20px;
    }

    .gallery-modal p {
      opacity: 0.85;
    }
    .gallery-filters {
        display: flex;
        gap: 12px;
        justify-content: center;
        margin-bottom: 40px;
        flex-wrap: wrap;
    }

    .filter-btn {
        padding: 8px 18px;
        border-radius: 30px;
        border: 1px solid var(--primary-light);
        background: transparent;
        color: var(--primary-light);
        cursor: pointer;
        font-weight: 600;
    }

    .filter-btn.active,
    .filter-btn:hover {
        background: var(--primary-light);
        color: #000;
    }

  </style>
</head>

<body>

    <div id="header"></div>
    <div class="gallery-filters">
        <button class="filter-btn active" data-filter="all">Tout</button>
        <button class="filter-btn" data-filter="Famille">Familles</button>
        <button class="filter-btn" data-filter="Bannière">Bannière</button>
        <button class="filter-btn" data-filter="Événement">Événement</button>
    </div>

    <main>
    <h2>📸 Galerie BoucleRP</h2>
    <p style="margin-bottom:40px; opacity:0.8;">
        Moments marquants, événements RP et souvenirs de la communauté.
    </p>

    <div class="gallery-grid" id="galleryGrid"></div>
    </main>

    <!-- MODAL -->
    <div class="gallery-modal" id="galleryModal">
        <div class="gallery-modal-content">
            <img id="modalImg">
            <h3 id="modalTitle"></h3>
            <p id="modalDesc"></p>
        </div>
    </div>

    <div id="footer"></div>

    <script src="js/layout.js"></script>
    <script src="js/gallery-data.js"></script>

    <script>
        const grid = document.getElementById("galleryGrid");
        const modal = document.getElementById("galleryModal");
        const modalImg = document.getElementById("modalImg");
        const modalTitle = document.getElementById("modalTitle");
        const modalDesc = document.getElementById("modalDesc");
        const filterButtons = document.querySelectorAll(".filter-btn");

        function renderGallery(filter = "all") {
            grid.innerHTML = "";

            galleryData
            .filter(item => filter === "all" || item.category === filter)
            .forEach(item => {
                const card = document.createElement("div");
                card.className = "gallery-card";

                card.innerHTML = `
                <img src="${item.image}" alt="${item.title}">
                <div class="gallery-info">
                    <h4>${item.title}</h4>
                    <span>📅 ${item.date} • ${item.category}</span>
                    <p>${item.description}</p>
                </div>
                `;

                card.addEventListener("click", () => {
                modal.style.display = "flex";
                modalImg.src = item.image;
                modalTitle.textContent = item.title;
                modalDesc.textContent = item.description;
                });

                grid.appendChild(card);
            });
        }

        // Gestion des filtres
        filterButtons.forEach(btn => {
            btn.addEventListener("click", () => {
            filterButtons.forEach(b => b.classList.remove("active"));
            btn.classList.add("active");
            renderGallery(btn.dataset.filter);
            });
        });

        // Fermeture modal
        modal.addEventListener("click", (e) => {
            if (e.target === modal) {
            modal.style.display = "none";
            }
        });

        // Chargement initial
        renderGallery();
    </script>


</body>
</html>
