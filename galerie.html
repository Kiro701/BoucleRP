<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HMC | Galerie</title>
  
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="Image/logo-bouclerp.webp">

  <style>
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 25px;
    }

    .gallery-card {
      background: rgba(15, 18, 30, 0.9);
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid var(--border-soft);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      cursor: pointer;
      position: relative;
    }

    .gallery-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 0 25px var(--primary-glow);
    }

    .gallery-card img {
      width: 100%;
      height: 160px;
      object-fit: cover;
    }

    .gallery-info {
      padding: 14px;
      text-align: left;
    }

    .gallery-info h4 {
      color: var(--primary-light);
      font-size: 1rem;
      margin-bottom: 6px;
      padding-right: 30px;
    }

    .gallery-info span {
      font-size: 0.75rem;
      opacity: 0.7;
      display: block;
      margin-bottom: 4px;
    }

    .gallery-info p {
      font-size: 0.85rem;
      opacity: 0.85;
      line-height: 1.4;
      margin-top: 8px;
    }

    /* MINI BOUTON PARTAGER */
    .mini-share-btn {
      position: absolute;
      top: 170px; /* Positionné juste au dessus du texte sur l'image ou le bandeau */
      right: 12px;
      background: rgba(122, 124, 255, 0.2);
      border: 1px solid var(--primary-light);
      color: var(--primary-light);
      border-radius: 8px;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
      z-index: 10;
    }

    .mini-share-btn:hover {
      background: var(--primary-light);
      color: #000;
      transform: scale(1.1);
    }

    /* FILTRES */
    .gallery-filters {
        display: flex;
        gap: 12px;
        justify-content: center;
        margin-bottom: 40px;
        flex-wrap: wrap;
    }

    .filter-btn {
        padding: 8px 18px;
        border-radius: 30px;
        border: 1px solid var(--primary-light);
        background: transparent;
        color: var(--primary-light);
        cursor: pointer;
        font-weight: 600;
        transition: 0.3s;
    }

    .filter-btn.active, .filter-btn:hover {
        background: var(--primary-light);
        color: #000;
    }

    /* MODAL */
    .gallery-modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.95);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      padding: 20px;
    }

    .gallery-modal-content {
      max-width: 1000px;
      width: 100%;
      text-align: center;
    }

    .gallery-modal img {
      max-width: 100%;
      max-height: 75vh;
      border-radius: 12px;
      box-shadow: 0 0 30px rgba(0,0,0,0.5);
    }

    /* NOTIFICATION */
    .copy-toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: #4ade80;
      color: white;
      padding: 10px 25px;
      border-radius: 50px;
      font-weight: bold;
      z-index: 10000;
      animation: fadeInOut 2.5s forwards;
    }

    @keyframes fadeInOut {
      0% { opacity: 0; bottom: 20px; }
      15% { opacity: 1; bottom: 30px; }
      85% { opacity: 1; bottom: 30px; }
      100% { opacity: 0; bottom: 20px; }
    }
  </style>
</head>

<body>
    <div id="header"></div>

    <main class="container">
        <h2 data-i18n="gallery_title">📸 Galerie BoucleRP</h2>
        <p style="margin-bottom:30px; opacity:0.8;" data-i18n="gallery_desc">
            Moments marquants, événements RP et souvenirs de la communauté.
        </p>

        <div class="gallery-filters">
            <button class="filter-btn active" data-filter="all" data-i18n="gallery_filter_all">Tout</button>
            <button class="filter-btn" data-filter="Famille" data-i18n="gallery_filter_family">Familles</button>
            <button class="filter-btn" data-filter="Bannière" data-i18n="gallery_filter_banner">Bannière</button>
            <button class="filter-btn" data-filter="Événement" data-i18n="gallery_filter_event">Événement</button>
            <button class="filter-btn" data-filter="Jeux" data-i18n="gallery_filter_game">Jeux</button>
            <button class="filter-btn" data-filter="Communauté" data-i18n="gallery_filter_community">Communauté</button>
        </div>

        <div class="gallery-grid" id="galleryGrid"></div>
    </main>

    <div class="gallery-modal" id="galleryModal">
        <div class="gallery-modal-content">
            <img id="modalImg">
            <h3 id="modalTitle" style="margin-top:20px; color: var(--primary-light);"></h3>
            <p id="modalDesc" style="margin: 10px 0; opacity: 0.9;"></p>
            <p id="modalAuthor" style="font-size: 0.8rem; opacity: 0.6;"></p>
        </div>
    </div>

    <div id="footer"></div>

    <script src="js/layout.js"></script>
    <script src="data/gallery-data.js"></script>

    <script>
        const grid = document.getElementById("galleryGrid");
        const modal = document.getElementById("galleryModal");
        const modalImg = document.getElementById("modalImg");
        const modalTitle = document.getElementById("modalTitle");
        const modalDesc = document.getElementById("modalDesc");
        const modalAuthor = document.getElementById("modalAuthor");
        const filterButtons = document.querySelectorAll(".filter-btn");

        // Fonction de partage
        async function shareImg(e, title) {
            e.stopPropagation();
            const hash = `#img-${encodeURIComponent(title)}`;
            const urlToShare = `${window.location.origin}${window.location.pathname}${hash}`;

            try {
                if (navigator.share) {
                    await navigator.share({
                        title: `HMC Galerie - ${title}`,
                        url: urlToShare
                    });
                } else {
                    await navigator.clipboard.writeText(urlToShare);
                    showToast("Lien de l'image copié !");
                }
            } catch (err) { console.log(err); }
        }

        function showToast(msg) {
            const toast = document.createElement("div");
            toast.className = "copy-toast";
            toast.innerText = msg;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 2500);
        }

        // Ouverture Modal
        function openModal(item) {
            modal.style.display = "flex";
            modalImg.src = item.image;
            modalTitle.textContent = item.title;
            modalDesc.textContent = item.description;
            modalAuthor.textContent = "📷 Image par " + item.author;
            // On met à jour l'URL sans recharger la page
            history.pushState(null, null, `#img-${encodeURIComponent(item.title)}`);
        }

        function renderGallery(filter = "all") {
            grid.innerHTML = "";
            galleryData
            .filter(item => filter === "all" || item.category === filter)
            .forEach(item => {
                const card = document.createElement("div");
                card.className = "gallery-card";
                card.id = `img-${encodeURIComponent(item.title)}`;

                card.innerHTML = `
                  <img src="${item.image}" alt="${item.title}">
                  <button class="mini-share-btn" title="Partager cette image" onclick="shareImg(event, '${item.title.replace(/'/g, "\\'")}')">
                    <svg width="14" height="14" fill="currentColor" viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92s2.92-1.31 2.92-2.92c0-1.61-1.31-2.92-2.92-2.92z"/></svg>
                  </button>
                  <div class="gallery-info">
                    <h4>${item.title}</h4>
                    <span>📅 ${item.date}</span>
                    <span class="gallery-author">📷 ${item.author}</span>
                    <p>${item.description}</p>
                  </div>
                `;

                card.addEventListener("click", () => openModal(item));
                grid.appendChild(card);
            });
        }

        // Vérification du lien au chargement
        function checkHash() {
            const hash = window.location.hash;
            if (hash && hash.startsWith("#img-")) {
                const title = decodeURIComponent(hash.replace("#img-", ""));
                const item = galleryData.find(i => i.title === title);
                if (item) {
                    openModal(item);
                    document.getElementById(`img-${encodeURIComponent(title)}`)?.scrollIntoView({ behavior: 'smooth' });
                }
            }
        }

        // Event Listeners
        filterButtons.forEach(btn => {
            btn.addEventListener("click", () => {
                filterButtons.forEach(b => b.classList.remove("active"));
                btn.classList.add("active");
                renderGallery(btn.dataset.filter);
            });
        });

        modal.addEventListener("click", (e) => {
            if (e.target === modal) {
                modal.style.display = "none";
                // On retire le hash de l'URL proprement
                history.pushState("", document.title, window.location.pathname);
            }
        });

        // Initialisation
        window.addEventListener('load', () => {
            renderGallery();
            checkHash();
        });
        window.addEventListener('hashchange', checkHash);
    </script>

    <script src="data/translations.js"></script>
    <script src="js/main-i18n.js"></script>
</body>
</html>
